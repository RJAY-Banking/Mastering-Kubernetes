
# this file is available in this path cd ~/.kube/config in management server

apiVersion: v1
clusters:
  - cluster:
      certificate-authority-data: XXXXXXXXXXX
      server: https://api.harinadh.xyz
      tls-server-name: api.internal.harinadh.xyz
    name: harinadh.xyz
contexts:
  - context:
      cluster: harinadh.xyz
      namespace: development
      user: user1
    name: user1-context
current-context: user1-context
kind: Config
users:
  - name: user1
    user:
      client-certificate: /root/useer1.crt
      client-key: /root/user1.key
